name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            profile: conan/profiles/macos-arm64
            preset: macos-release
          - os: windows-2022
            profile: conan/profiles/windows-x86_64
            preset: windows-release

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Initialize MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -version '[17.0,18.0)' -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw "Visual Studio 2022 with MSVC was not found." }
          $environment = & cmd /d /s /c "call `"$installation/Common7/Tools/VsDevCmd.bat`" -arch=x64 -host_arch=x64 -vcvars_ver=14.44 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "MSVC environment initialization failed." }
          if (-not ($environment -match '^VCToolsVersion=14\.44\.')) {
            throw "Conan compiler.version=194 requires MSVC tools 14.44."
          }
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name, $value = $Matches[1], $Matches[2]
              if ([Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      - name: Bootstrap macOS toolchain and verified Qt
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "WEALTHTRACKER_LLVM_ROOT=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"
          sh scripts/bootstrap.sh
          echo "$GITHUB_WORKSPACE/build/tooling/bin" >> "$GITHUB_PATH"

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        run: >
          python -m pip install
          aqtinstall==3.3.0
          conan==2.19.1
          cmake==4.1.2
          ninja==1.13.0

      - name: Install Windows Qt
        if: runner.os == 'Windows'
        run: >
          aqt install-qt
          windows
          desktop
          6.11.1
          win64_msvc2022_64
          --modules qtwebview
          -O build/qt

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/*') }}

      - name: Install dependencies
        run: >
          conan install .
          --profile:host=${{ matrix.profile }}
          --profile:build=${{ matrix.profile }}
          --build=missing
          -of=build/${{ matrix.preset }}

      - name: Resolve runtime license metadata
        run: >
          conan graph info .
          --profile:host=${{ matrix.profile }}
          --profile:build=${{ matrix.profile }}
          --format=json
          --out-file=build/${{ matrix.preset }}/dependency-graph.json

      - name: Check resolved Conan runtime licenses
        run: python scripts/check_runtime_licenses.py build/${{ matrix.preset }}/dependency-graph.json

      - name: Initialize Windows runtime paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = (Resolve-Path "build/${{ matrix.preset }}/generators/conanrun.bat").Path
          $environment = & cmd /d /s /c "call `"$runtime`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "Conan runtime environment initialization failed." }
          $runtimePath = $environment | Where-Object { $_ -match '^PATH=' } | Select-Object -First 1
          if (-not $runtimePath) { throw "Conan runtime PATH is missing." }
          $qtBin = (Resolve-Path 'build/qt/6.11.1/msvc2022_64/bin').Path
          "PATH=$qtBin;$($runtimePath.Substring(5))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure macOS
        if: runner.os == 'macOS'
        run: sh scripts/configure.sh ${{ matrix.preset }}

      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Lint QML
        run: cmake --build --preset ${{ matrix.preset }} --target wealthtracker_qmllint

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Stage application bundle
        run: cmake --install build/${{ matrix.preset }} --prefix build/stage/${{ matrix.preset }}

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: python -m pip install conan==2.19.1

      - name: Validate Conan recipe
        run: conan inspect .

      - name: Verify task files are ignored
        run: git check-ignore tasks/todo.md tasks/lessons.md

      - name: Validate script syntax
        run: |
          for script in scripts/bootstrap.sh scripts/configure.sh scripts/verify.sh android/build.sh android/verify.sh; do
            sh -n "$script" || exit
          done
          node --check scripts/zen_plugin_host.mjs
          python -c "compile(open('scripts/install_qt_macos.py', encoding='utf-8').read(), 'scripts/install_qt_macos.py', 'exec')"
          python -m unittest discover -s tests/scripts -v

      - name: Scan fetched Git history for secrets
        run: >
          docker run --rm --network none --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner --log-opts="--all" .

      - name: Scan Conan dependencies
        run: >
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
          scan source --lockfile=conan.lock

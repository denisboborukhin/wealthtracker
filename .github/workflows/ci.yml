name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      WT_CI_CONAN_PROFILE: conan/profiles/macos-arm64
      WT_CI_PRESET: macos-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Bootstrap macOS toolchain and verified Qt
        run: |
          brew install llvm@22
          echo "WEALTHTRACKER_LLVM_ROOT=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"
          sh scripts/bootstrap.sh
          echo "$GITHUB_WORKSPACE/build/tooling/bin" >> "$GITHUB_PATH"

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2/p
          key: conan-macos-15-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/*') }}

      - name: Install dependencies
        run: >
          conan install .
          --profile:host="$WT_CI_CONAN_PROFILE"
          --profile:build="$WT_CI_CONAN_PROFILE"
          --build=missing
          -of="build/$WT_CI_PRESET"

      - name: Resolve runtime license metadata
        run: >
          conan graph info .
          --profile:host="$WT_CI_CONAN_PROFILE"
          --profile:build="$WT_CI_CONAN_PROFILE"
          --format=json
          --out-file="build/$WT_CI_PRESET/dependency-graph.json"

      - name: Check resolved Conan runtime licenses
        run: python scripts/check_runtime_licenses.py "build/$WT_CI_PRESET/dependency-graph.json"

      - name: Configure macOS
        run: sh scripts/configure.sh "$WT_CI_PRESET"

      - name: Build
        run: cmake --build --preset "$WT_CI_PRESET"

      - name: Lint QML
        run: cmake --build --preset "$WT_CI_PRESET" --target wealthtracker_qmllint

      - name: Test
        run: ctest --preset "$WT_CI_PRESET" --output-on-failure

      - name: Build macOS DMG
        run: cmake --build --preset "$WT_CI_PRESET" --target package

      - name: Upload macOS preview
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WealthTracker-macOS-preview
          path: build/${{ env.WT_CI_PRESET }}/WealthTracker-*.dmg
          if-no-files-found: error
          retention-days: 7

  android:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Bootstrap host and Android Qt SDKs
        run: |
          sh scripts/bootstrap.sh
          build/tooling/bin/python android/tools/install_qt.py https://ftp.fau.de/qtproject/ build/qt

      - name: Cache Android Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/conan-android/p
          key: conan-android-macos-15-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/macos-arm64', 'android/conan.profile', 'android/build.sh') }}

      - name: Build and verify Android APK
        run: |
          export JAVA_HOME="${JAVA_HOME_21_arm64:?JDK 21 is required}"
          unset ANDROID_NDK_ROOT
          sh android/build.sh

      - name: Upload Android preview
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WealthTracker-Android-arm64-preview
          path: |
            android/output/wealthtracker-*-debug.apk
            android/output/wealthtracker-*-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: python -m pip install conan==2.19.1

      - name: Validate Conan recipe
        run: conan inspect .

      - name: Verify task files are ignored
        run: git check-ignore tasks/todo.md tasks/lessons.md

      - name: Validate script syntax
        run: |
          for script in scripts/bootstrap.sh scripts/configure.sh scripts/verify.sh android/build.sh android/verify.sh; do
            sh -n "$script" || exit
          done
          node --check scripts/zen_plugin_host.mjs
          python -c "compile(open('scripts/install_qt_macos.py', encoding='utf-8').read(), 'scripts/install_qt_macos.py', 'exec')"
          python -m unittest discover -s tests/scripts -v

      - name: Scan fetched Git history for secrets
        run: >
          docker run --rm --network none --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact=100 --no-banner --log-opts="--all" .

      - name: Scan Conan dependencies
        run: >
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
          scan source --lockfile=conan.lock

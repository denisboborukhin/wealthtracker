name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            profile: conan/profiles/macos-arm64
            preset: macos-release
            qt_host: mac
            qt_arch: clang_64
          - os: windows-2025
            profile: conan/profiles/windows-x86_64
            preset: windows-release
            qt_host: windows
            qt_arch: win64_msvc2022_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $installation) { throw "MSVC installation not found." }
          $environment = & cmd /d /s /c "call `"$installation/Common7/Tools/VsDevCmd.bat`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "MSVC environment initialization failed." }
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name, $value = $Matches[1], $Matches[2]
              if ([Environment]::GetEnvironmentVariable($name) -ne $value) {
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      - name: Install build tools
        run: >
          python -m pip install
          aqtinstall==3.3.0
          conan==2.19.1
          cmake==4.1.2
          ninja==1.13.0

      - name: Install Qt
        run: >
          aqt install-qt
          ${{ matrix.qt_host }}
          desktop
          6.11.1
          ${{ matrix.qt_arch }}
          --modules qtwebview
          -O build/qt

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan.lock', 'conan/profiles/*') }}
          restore-keys: conan-${{ runner.os }}-

      - name: Install dependencies
        run: >
          conan install .
          --profile:host=${{ matrix.profile }}
          --profile:build=${{ matrix.profile }}
          --build=missing
          -of=build/${{ matrix.preset }}

      - name: Initialize Windows runtime paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = (Resolve-Path "build/${{ matrix.preset }}/generators/conanrun.bat").Path
          $environment = & cmd /d /s /c "call `"$runtime`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "Conan runtime environment initialization failed." }
          $runtimePath = $environment | Where-Object { $_ -match '^PATH=' } | Select-Object -First 1
          if (-not $runtimePath) { throw "Conan runtime PATH is missing." }
          $qtBin = (Resolve-Path 'build/qt/6.11.1/msvc2022_64/bin').Path
          "PATH=$qtBin;$($runtimePath.Substring(5))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Lint QML
        run: cmake --build --preset ${{ matrix.preset }} --target wealthtracker_qmllint

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Stage application bundle
        run: cmake --install build/${{ matrix.preset }} --prefix build/stage/${{ matrix.preset }}

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: python -m pip install conan==2.19.1

      - name: Validate Conan recipe
        run: conan inspect .

      - name: Check forbidden runtime licenses
        shell: python
        run: |
          from pathlib import Path
          forbidden = ("GPL-", "AGPL-")
          files = [Path("conanfile.py"), *Path("cmake").glob("**/*")]
          findings = []
          for file in files:
              text = file.read_text(encoding="utf-8")
              for token in forbidden:
                  if token in text:
                      findings.append(f"{file}: contains {token}")
          if findings:
              raise SystemExit("\n".join(findings))

      - name: Verify task files are ignored
        run: git check-ignore tasks/todo.md tasks/lessons.md

      - name: Validate script syntax
        run: |
          sh -n scripts/bootstrap.sh scripts/configure.sh
          node --check scripts/zen_plugin_host.mjs
          python -c "compile(open('scripts/install_qt_macos.py', encoding='utf-8').read(), 'scripts/install_qt_macos.py', 'exec')"
          python -m unittest discover -s tests/scripts -v
